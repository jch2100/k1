<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Content Studio · 퍼스널 브랜딩 수익화 커맨드 센터</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="app">
    <aside class="sidebar">
      <div class="brand">
        <div class="brand-logo">CS</div>
        <div class="brand-meta">
          <strong id="brandName">Content Studio</strong>
          <span id="brandTagline">퍼스널 브랜딩 수익화</span>
        </div>
      </div>
      <nav class="nav">
        <button class="nav-item active" data-view="dashboard"><span>📊</span> 대시보드</button>
        <button class="nav-item" data-view="pipeline"><span>🗂️</span> 콘텐츠 파이프라인</button>
        <button class="nav-item" data-view="ideas"><span>💡</span> 아이디어 인박스</button>
        <button class="nav-item" data-view="revenue"><span>💰</span> 수익 추적</button>
        <button class="nav-item" data-view="brand"><span>🎯</span> 브랜드 키트</button>
      </nav>
      <div class="sidebar-foot">
        <button id="exportBtn" class="ghost-btn">데이터 내보내기</button>
        <button id="importBtn" class="ghost-btn">가져오기</button>
        <button id="resetBtn" class="ghost-btn danger">초기화</button>
        <input type="file" id="importFile" accept="application/json" hidden />
      </div>
    </aside>

    <main class="main">
      <div id="view-dashboard" class="view"></div>
      <div id="view-pipeline" class="view hidden"></div>
      <div id="view-ideas" class="view hidden"></div>
      <div id="view-revenue" class="view hidden"></div>
      <div id="view-brand" class="view hidden"></div>
    </main>
  </div>

  <!-- Modal -->
  <div id="modalBackdrop" class="modal-backdrop hidden">
    <div class="modal">
      <div class="modal-head">
        <h3 id="modalTitle">제목</h3>
        <button id="modalClose" class="icon-btn">✕</button>
      </div>
      <div id="modalBody" class="modal-body"></div>
    </div>
  </div>

  <div id="toast" class="toast hidden"></div>

  <script src="app.js"></script>
</body>
</html>
